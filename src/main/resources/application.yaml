spring:
  application:
    name: barbearia-oliveira

  # Lê variáveis do arquivo .env na raiz do projeto (se existir).
  # Variáveis de ambiente do sistema continuam valendo e têm prioridade.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Em produção vem do Railway (DB_URL); no seu computador usa o banco local
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barbeariaOliveira}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

  flyway:
    placeholders:
      admin_email: ${ADMIN_EMAIL}
      admin_senha_hash: ${ADMIN_SENHA_HASH}

barbearia:
  nome: Barbearia Oliveira
  whatsapp: ${BARBEARIA_WHATSAPP:}
  fuso-horario: America/Recife
  antecedencia-minima: 60m
  dias-maximos-antecedencia: 30
  prazo-confirmacao: 20m
  intervalo-horarios: 30m

cors:
  # Separe várias origens por vírgula. Ex.: CORS_ORIGENS=http://localhost:5173,https://barbeariaoliveira.com.br
  origens-permitidas: ${CORS_ORIGENS:http://localhost:5173}

telegram:
  # Avisos de novos agendamentos no Telegram (veja o README)
  habilitado: ${TELEGRAM_HABILITADO:false}
  token: ${TELEGRAM_TOKEN:}
  # Chats que recebem todos os avisos (ex.: dono). Separe por vírgula.
  chat-ids-admin: ${TELEGRAM_CHAT_IDS:}
  # Link do painel nas mensagens (só endereço público; localhost o Telegram recusa)
  painel-url: ${PAINEL_URL:}

jwt:
  segredo: ${JWT_SECRET}
  expiracao: 8h

server:
  # O Railway informa a porta na variável PORT
  port: ${PORT:8080}

# Documentação da API (Swagger). Em produção: SWAGGER_HABILITADO=false
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:true}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:true}

management:
  endpoints:
    web:
      exposure:
        include: health   # /actuator/health: o Railway usa para saber se a API subiu

rate-limit:
  # true em produção (atrás do proxy do Railway): pega o IP real do cliente no X-Forwarded-For
  confiar-proxy: ${CONFIAR_PROXY:false}
  agendamento:
    capacidade: 10
    periodo: 1h
  login:
    capacidade: 5
    periodo: 15m

recaptcha:
  habilitado: ${RECAPTCHA_HABILITADO:false}
  segredo: ${RECAPTCHA_SECRET:}
  nota-minima: 0.5
  url: https://www.google.com/recaptcha/api/siteverify
