spring:
  application:
    name: barbearia-oliveira

  datasource:
    url: jdbc:postgresql://localhost:5432/barbeariaOliveira
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

barbearia:
  fuso-horario: America/Recife
  antecedencia-minima: 60m
  dias-maximos-antecedencia: 30
  prazo-confirmacao: 20m
