spring:
  application:
    name: barbearia-oliveira

  datasource:
    url: jdbc:postgresql://localhost:5432/barbeariaOliveira
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

  flyway:
    placeholders:
      admin_email: ${ADMIN_EMAIL}
      admin_senha_hash: ${ADMIN_SENHA_HASH}

barbearia:
  fuso-horario: America/Recife
  antecedencia-minima: 60m
  dias-maximos-antecedencia: 30
  prazo-confirmacao: 20m
  intervalo-horarios: 30m

jwt:
  segredo: ${JWT_SECRET}
  expiracao: 8h
